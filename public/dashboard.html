<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabinet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="card dash-info">
  <h1>Xush kelibsiz! 🎉</h1>
  <p class="sub">Siz muvaffaqiyatli kirdingiz</p>
  <div class="big" id="name">...</div>
  <button class="btn-red" onclick="logout()">Chiqish</button>
</div>

<script>
async function load() {
  const res = await fetch('/api/me');
  if (!res.ok) { location.href = '/login'; return; }
  const data = await res.json();
  document.getElementById('name').textContent = data.username;
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
}
load();
</script>
</body>
</html>
